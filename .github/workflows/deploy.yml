name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy navykus.online
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger deploy via webhook
        env:
          DEPLOY_URL: ${{ secrets.NAVYKUS_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.NAVYKUS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          : "${DEPLOY_URL:?Missing NAVYKUS_DEPLOY_URL secret}"
          : "${DEPLOY_TOKEN:?Missing NAVYKUS_DEPLOY_TOKEN secret}"

          echo "Triggering deploy at ${DEPLOY_URL}..."

          curl -sf -X POST "${DEPLOY_URL}" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "'"${GITHUB_SHA}"'", "repo": "'"${GITHUB_REPOSITORY}"'"}' \
            --max-time 10

          echo ""
          echo "=== ✅ Deploy triggered ==="

      - name: Wait for deploy to complete
        run: |
          echo "Waiting for deploy to complete (60s)..."
          sleep 60

          echo "=== Checking health ==="
          PUBLIC_URL="${{ secrets.NAVYKUS_PUBLIC_URL }}"
          : "${PUBLIC_URL:?Missing NAVYKUS_PUBLIC_URL secret}"

          for attempt in $(seq 1 12); do
            if curl -fsS "${PUBLIC_URL}/api/health" >/dev/null 2>&1; then
              echo "Health check OK"
              curl -s "${PUBLIC_URL}/api/health"
              echo ""
              echo "=== ✅ DEPLOY SUCCESSFUL ==="
              exit 0
            fi
            echo "Attempt ${attempt}/12 - waiting..."
            sleep 10
          done

          echo "=== ❌ Health check failed after deploy ==="
          exit 1