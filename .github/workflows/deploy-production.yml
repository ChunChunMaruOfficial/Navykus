name: Deploy Navykus

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_USER:-}" ] || [ -z "${SERVER_SSH_KEY:-}" ]; then
            echo "::error::Missing SERVER_HOST / SERVER_USER / SERVER_SSH_KEY repository secrets."
            exit 1
          fi
          SERVER_PORT="${SERVER_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Refresh the host key every run so a server rebuild does not wedge the pipeline.
          ssh-keyscan -H -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null

          # `bash -lc` → a login shell so nvm / PATH from the operator's profile is available.
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "bash -lc 'set -e; cd /var/www/Navykus && git fetch origin --prune && git reset --hard origin/main && bash deploy-prod.sh'"

      - name: Deployment finished
        run: echo "Production deployment completed successfully"
